[package]
name = "baghcheh"
version = "1.0.0"
description = "Baghcheh home hub"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tiny_http = "0.12"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

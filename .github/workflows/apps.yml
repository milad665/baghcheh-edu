# Builds the Android APK and the desktop home hub (Windows, macOS, Linux) for free on GitHub's runners.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0 to also create a draft release.
# The website itself needs no build: these apps only package it (see open.html).
#
# Optional secrets for signing the APK (without them it is signed with a throwaway debug key, and an APK
# signed later with a real key cannot update it):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Desktop builds are not signed (no paid certificates); guide.html explains the "unknown developer" warning.
name: Apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/baghcheh.jks"
          echo "BAGHCHEH_KEYSTORE=$RUNNER_TEMP/baghcheh.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          BAGHCHEH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BAGHCHEH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BAGHCHEH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mkdir -p ../downloads
          cp build/outputs/apk/release/baghcheh-release.apk ../downloads/baghcheh.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: downloads/baghcheh.apk

  desktop:
    needs: android # the hub also serves the APK to tablets on the home network
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
          - os: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            name: linux
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: downloads
      - name: Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/deb/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/**/*
